<vbox onload="PDFAIBookmarks_Preferences.init()">
    <linkset>
        <html:link rel="localization" href="pdf-ai-bookmarks.ftl" />
    </linkset>

    <html:style>
        #pdf-ai-bookmarks-api-key { width: 100%; }
    </html:style>

    <groupbox>
        <label>
            <html:h2 data-l10n-id="pdf-ai-bookmarks-prefs-api-group-title"></html:h2>
        </label>

        <hbox align="center">
            <label data-l10n-id="pdf-ai-bookmarks-prefs-api-key-label" control="pdf-ai-bookmarks-api-key" style="width: 80px;" />
            <html:input id="pdf-ai-bookmarks-api-key" type="password"
                data-l10n-id="pdf-ai-bookmarks-prefs-api-key-input"
                preference="extensions.pdf-ai-bookmarks.apiKey" />
        </hbox>

        <description data-l10n-id="pdf-ai-bookmarks-prefs-api-key-help"
            style="color: gray; font-size: 0.9em; margin-top: 5px;"></description>
    </groupbox>

    <groupbox>
        <label>
            <html:h2 data-l10n-id="pdf-ai-bookmarks-prefs-options-group-title"></html:h2>
        </label>

        <checkbox id="pdf-ai-bookmarks-polish" data-l10n-id="pdf-ai-bookmarks-prefs-polish-label"
            preference="extensions.pdf-ai-bookmarks.polish" />
    </groupbox>
</vbox>
